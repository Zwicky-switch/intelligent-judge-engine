# ============================================================
# 智评·Insight nginx 反向代理配置
# - 前端静态文件: / -> /usr/share/nginx/html
# - 后端 API: /v1 -> http://backend:8000/v1
# - 大文件上传(音频/视频): 放宽 client_max_body_size
# - gzip 压缩静态资源
# ============================================================

upstream insight_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 大文件上传: 音频 60MB / 视频 300MB
    client_max_body_size 350m;
    client_body_buffer_size 16m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /v1/ {
        proxy_pass http://insight_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 音频/视频 ASR 转写可能耗时较长, 放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # 上传缓冲
        proxy_request_buffering on;
    }

    # 健康检查
    location /health {
        proxy_pass http://insight_backend/;
        access_log off;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

