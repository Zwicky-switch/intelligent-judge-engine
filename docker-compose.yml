# ============================================================
# 智评·Insight 生产部署 docker-compose
# 用法:
#   1. cp .env.example .env  (填写密钥)
#   2. docker compose up -d --build
#   3. 访问 http://localhost  (nginx 反代后端 + 前端静态)
# ============================================================
services:
  backend:
    build: ./backend
    container_name: insight-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend/data:/app/data          # SQLite 数据库持久化
      - ./backend/uploads:/app/uploads    # 学生作答媒体文件
      - ./backend/models:/root/.cache/huggingface  # ASR 模型缓存(可选, 首次启动自动下载)
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: insight-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # 启用 HTTPS 时取消注释
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro  # 前端构建产物
      # - ./deploy/certs:/etc/nginx/certs:ro       # HTTPS 证书
    depends_on:
      - backend
