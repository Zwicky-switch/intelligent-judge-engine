<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>媒体评分雷达图</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    color: #1f2937;
    padding: 32px 16px;
  }
  .container { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    margin-bottom: 20px;
  }
  .upload-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .upload-item label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .upload-item input[type=file] {
    width: 100%;
    padding: 8px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 13px;
    background: #f9fafb;
  }
  .filename { font-size: 12px; color: #6b7280; margin-top: 6px; word-break: break-all; }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 28px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover:not(:disabled) { background: #1d4ed8; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .metric {
    text-align: center;
    padding: 12px 4px;
    background: #f3f4f6;
    border-radius: 8px;
  }
  .metric .label { font-size: 12px; color: #6b7280; }
  .metric .value { font-size: 22px; font-weight: 700; color: #111827; margin-top: 4px; }
  .metric.score { background: #dbeafe; }
  .metric.score .value { color: #1d4ed8; }
  #msg { font-size: 14px; margin-top: 12px; min-height: 20px; }
  .err { color: #dc2626; }
  .ok { color: #059669; }
  .chart-wrap { position: relative; height: 420px; }
</style>
</head>
<body>
<div class="container">
  <h1>媒体评分 · 雷达图</h1>

  <div class="card">
    <div class="upload-row">
      <div class="upload-item">
        <label for="image">图片</label>
        <input type="file" id="image" accept="image/*" />
        <div class="filename" id="imageName"></div>
      </div>
      <div class="upload-item">
        <label for="audio">语音</label>
        <input type="file" id="audio" accept="audio/*" />
        <div class="filename" id="audioName"></div>
      </div>
      <div class="upload-item">
        <label for="video">视频</label>
        <input type="file" id="video" accept="video/*" />
        <div class="filename" id="videoName"></div>
      </div>
    </div>
    <button id="submitBtn">提交分析</button>
    <div id="msg"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="result-grid">
      <div class="metric"><div class="label">a 视觉</div><div class="value" id="vA">-</div></div>
      <div class="metric"><div class="label">b 听觉</div><div class="value" id="vB">-</div></div>
      <div class="metric"><div class="label">c 动态</div><div class="value" id="vC">-</div></div>
      <div class="metric"><div class="label">d 完整度</div><div class="value" id="vD">-</div></div>
      <div class="metric"><div class="label">e 质量</div><div class="value" id="vE">-</div></div>
      <div class="metric score"><div class="label">总分 score</div><div class="value" id="vScore">-</div></div>
    </div>
    <div class="chart-wrap">
      <canvas id="radarChart"></canvas>
    </div>
  </div>
</div>

<script>
  const API_URL = "http://localhost:5000/api/analyze";

  const $ = (id) => document.getElementById(id);
  let chart = null;

  ["image", "audio", "video"].forEach((key) => {
    $(key).addEventListener("change", (e) => {
      const f = e.target.files[0];
      $(key + "Name").textContent = f ? f.name : "";
    });
  });

  $("submitBtn").addEventListener("click", async () => {
    const fd = new FormData();
    let hasFile = false;
    ["image", "audio", "video"].forEach((key) => {
      const f = $(key).files[0];
      if (f) { fd.append(key, f); hasFile = true; }
    });
    if (!hasFile) {
      $("msg").innerHTML = '<span class="err">请至少选择一个文件</span>';
      return;
    }

    $("submitBtn").disabled = true;
    $("msg").innerHTML = '<span class="ok">上传分析中…</span>';

    try {
      const res = await fetch(API_URL, { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "请求失败");
      renderResult(data);
      clearFileInputs();  // 上传成功后清空所有文件选择框，不留上一次痕迹
      $("msg").innerHTML = '<span class="ok">分析完成</span>';
    } catch (err) {
      $("msg").innerHTML = '<span class="err">错误：' + err.message + '</span>';
    } finally {
      $("submitBtn").disabled = false;
    }
  });

  // 清空所有文件选择框和文件名显示，消除上一次上传痕迹
  function clearFileInputs() {
    ["image", "audio", "video"].forEach((key) => {
      $(key).value = "";          // 清空文件输入框
      $(key + "Name").textContent = "";  // 清空文件名显示
    });
  }

  function renderResult(d) {
    $("resultCard").style.display = "block";
    $("vA").textContent = d.a;
    $("vB").textContent = d.b;
    $("vC").textContent = d.c;
    $("vD").textContent = d.d;
    $("vE").textContent = d.e;
    $("vScore").textContent = d.score;

    const labels = ["a 视觉", "b 听觉", "c 动态", "d 完整度", "e 质量"];
    const values = [d.a, d.b, d.c, d.d, d.e];

    if (chart) chart.destroy();
    chart = new Chart($("radarChart"), {
      type: "radar",
      data: {
        labels,
        datasets: [{
          label: "评分",
          data: values,
          backgroundColor: "rgba(37, 99, 235, 0.25)",
          borderColor: "rgba(37, 99, 235, 1)",
          borderWidth: 2,
          pointBackgroundColor: "rgba(37, 99, 235, 1)",
          pointRadius: 4,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            min: 0,
            max: 100,
            ticks: { stepSize: 20, backdropColor: "transparent" },
            pointLabels: { font: { size: 14 } },
          },
        },
        plugins: { legend: { display: false } },
      },
    });
  }
</script>
</body>
</html>
